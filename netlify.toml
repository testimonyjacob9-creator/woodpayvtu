[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "."
  environment = { SECRETS_SCAN_OMIT_KEYS = "FIREBASE_PROJECT_ID,FIREBASE_WEB_API_KEY", SECRETS_SCAN_OMIT_PATHS = "**/node_modules/**" }

# The automatic nightly API-based payout (daily-settlement.js) is disabled
# for now — it would fail every run on Flutterwave's mandatory IP
# whitelisting requirement, since Netlify's outbound IP rotates. Settlement
# amounts are instead sent manually via the Flutterwave dashboard and
# confirmed through the Settlement tab (manual-settlement.js), which never
# calls the Transfers API and so is never blocked.
#
# To re-enable full automation later (after setting up a static-IP proxy —
# see STATIC_IP_PROXY_URL in _settlementCore.js), uncomment this:
# [functions."daily-settlement"]
#   schedule = "30 22 * * *"

# Runs every day at 07:00 WAT (06:00 UTC) — checks scheduledPurchases for
# anything due (weekly/monthly recurring data plans) and executes them.
# Unlike daily-settlement above, this only talks to Firestore + Bigisub, not
# Flutterwave's Transfers API, so the IP-whitelisting issue doesn't apply.
[functions."process-scheduled-purchases"]
  schedule = "0 6 * * *"

# Runs daily at 08:00 UTC (~09:00 WAT). Actual per-user cadence is every
# 2 days, enforced inside the function via lastReengagementSentAt — see
# the comment at the top of reengage-inactive-users.js for why a daily
# cron + in-function gating is used instead of trying to express "every
# 2 days" directly in the cron schedule.
[functions."reengage-inactive-users"]
  schedule = "0 8 * * *"

# Runs every 20 minutes — looks for transactions stuck in 'pending' and
# auto-confirms what it safely can (currently: betting only, via Bigisub's
# confirmed requery endpoint). See the top of
# reconcile-pending-transactions.js for why other service types are
# flagged for manual review instead of auto-confirmed.
[functions."reconcile-pending-transactions"]
  schedule = "*/20 * * * *"

